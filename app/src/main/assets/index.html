:var(--text)}.badge{position:absolute;right:4px;top:4px;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:var(--danger);font-size:9px;display:grid;place-items:center}

.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.cal-head{padding:6px 8px;font-size:9px;color:var(--muted)}.cal-day{min-height:115px;padding:7px;border-radius:13px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.018);transition:.2s}.cal-day:hover{background:rgba(255,255,255,.036)}.cal-day.today{border-color:color-mix(in srgb,var(--accent) 28%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 9%,transparent)}.cal-day.other{opacity:.35}.cal-num{font-size:9px;color:#a8b6cf}.cal-evt{margin-top:5px;padding:5px 6px;border-radius:8px;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(120,168,255,.08);border-left:2px solid var(--accent)}.cal-evt.task{border-left-color:var(--warn)}.cal-evt.exam{border-left-color:var(--danger)}.cal-evt.personal{border-left-color:var(--success)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field select,.field textarea,.inline-input{width:100%;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);border-radius:12px;padding:10px 11px;outline:0}.field input:focus,.field select:focus,.field textarea:focus,.inline-input:focus{border-color:color-mix(in srgb,var(--accent) 42%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 8%,transparent)}textarea{min-height:120px;resize:vertical}.form-help{font-size:9px;color:var(--muted);line-height:1.5}.switch{width:42px;height:24px;position:relative;display:inline-block}.switch input{display:none}.switch span{position:absolute;inset:0;border-radius:99px;background:#29354a;transition:.2s}.switch span:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#d8deea;transition:.2s}.switch input:checked+span{background:linear-gradient(135deg,var(--accent),var(--accent2))}.switch input:checked+span:after{transform:translateX(18px);background:white}

function currentSemester(){const n=Number(state.profile.currentSemester||1);return state.semesters.find(s=>Number((s.name||'').match(/\d+/)?.[0]||0)===n)||state.semesters.find(s=>s.status==='active')||state.semesters[0]||null;}
function courseById(id){return state.courses.find(c=>c.id===id);}
function coursesForSem(semId){return state.courses.filter(c=>c.semesterId===semId);}
function courseGradePoints(c){if(c.gradePoint!==''&&c.gradePoint!==null&&c.gradePoint!==undefined){const n=Number(c.gradePoint);return Number.isFinite(n)?n:null}const gp=(state.gradingProfiles.find(g=>g.id===c.gradingProfileId)||state.gradingProfiles.find(g=>g.id===state.activeGradingProfile)||state.gradingProfiles[0]);if(!gp||!c.grade)return null;const row=gp.scale.find(r=>String(r[0]).toUpperCase()===String(c.grade).toUpperCase());return row?Number(row[1]):null;}
function semesterGPA(semId,officialOnly=false){const cs=coursesForSem(semId).filter(c=>c.countGpa!==false&&Number(c.credits)>0);if(!cs.length)return null;let q=0,cr=0;for(const c of cs){const gp=courseGradePoints(c);if(gp===null)return officialOnly?null:null;q+=gp*Number(c.credits);cr+=Number(c.credits)}return cr?q/cr:null;}
function cgpa(){const cs=state.courses.filter(c=>c.countCgpa!==false&&Number(c.credits)>0);let q=0,cr=0;for(const c of cs){const gp=courseGradePoints(c);if(gp===null)continue;q+=gp*Number(c.credits);cr+=Number(c.credits)}return cr?q/cr:null;}
function attendanceStats(courseId){const rs=state.attendance.filter(a=>a.courseId===courseId);const held=rs.filter(a=>!['cancelled','excused'].includes(a.status));const present=held.filter(a=>['present','late'].includes(a.status)).length;const late=held.filter(a=>a.status==='late').length;return {held:held.length,present,late,absent:held.filter(a=>a.status==='absent').length,percent:held.length?present/held.length*100:null};}
function weightedCourseScore(courseId){const ass=state.assessments.filter(a=>a.courseId===courseId&&!['dropped','excused'].includes(a.status));if(!ass.length)return null;let total=0,weight=0,missing=false;for(const a of ass){const w=Number(a.weight||0);if(w<0)continue;if(a.obtained===''||a.obtained===null||a.obtained===undefined||a.status==='pending'){missing=true;continue}const marks=Number(a.obtained),max=Number(a.max);if(!Number.isFinite(max)||max<=0||!Number.isFinite(marks))return null;if(marks<0||marks>max)return null;total+=(marks/max*100)*w;weight+=w;}if(weight<=0)return null;return {score:total/weight,weight,missing,complete:Math.abs(weight-100)<0.0001};}
function calcRequiredFinal(courseId,target){const ass=state.assessments.filter(a=>a.courseId===courseId&&!['dropped','excused'].includes(a.status));const pending=ass.filter(a=>a.obtained===''||a.obtained===null||a.obtained===undefined);if(pending.length!==1)return null;const p=pending[0],cur=ass.filter(a=>a!==p);let total=0,w=0;for(const a of cur){const ww=Number(a.weight||0);const marks=Number(a.obtained),max=Number(a.max);if(!ww||!max)return null;total+=(marks/max*100)*ww;w+=ww;}const pw=Number(p.weight||0);if(!pw)return null;const required=(target*(w+pw)-total)/pw;return required;}
function toast(title,msg,type='ok'){const host=document.getElementById('toastHost');if(!host)return;const el=document.createElement('div');el.className='toast '+(type==='err'?'err':type==='warn'?'warn':'ok');el.innerHTML=`<strong>${esc(title)}</strong><span>${esc(msg)}</span>`;host.appendChild(el);setTimeout(()=>el.remove(),4200)}

function startReminderEngine(){setInterval(()=>{const now=new Date();const d=today(now);const cur=now.getHours()*60+now.getMinutes();for(const c of state.timetable){if(Number(c.day)!==now.getDay())continue;if(c.startDate&&d<c.startDate)continue;if(c.endDate&&d>c.endDate)continue;const [h,m]=String(c.start||'00:00').split(':').map(Number);const mins=h*60+m-Number(c.reminder||0);if(Number(c.reminder)>0&&cur===mins){const key='r_'+c.id+'_'+d; if(localStorage.getItem(key))continue;localStorage.setItem(key,'1');const co=courseById(c.courseId);pushNotification('Upcoming class',`${co?.name||'Class'} starts in ${c.reminder} minutes${c.room?' · '+c.room:''}`);}}},30000)}
function pushNotification(title,message){state.notifications.unshift({id:uid('n'),title,message,time:new Date().toISOString(),read:false});state.notifications=state.notifications.slice(0,120);persist();updateBadge();toast(title,message,'ok');if(state.settings.notifications&&'Notification' in window){if(Notification.permission==='granted'){try{new Notification('MaoozOS · '+title,{body:message})}catch{}}}}
function requestNotifications(){if(!('Notification' in window)){userError('Browser notifications unavailable','This browser does not provide the Notification API.','In-app reminders still work.');return;}Notification.requestPermission().then(p=>toast('Notifications',p==='granted'?'Browser notifications enabled.':'Permission not granted; in-app reminders remain available.',p==='granted'?'ok':'warn')).catch(()=>userError('Notification permission failed','The browser did not return a permission result.','Use in-app reminders or try again.'));}
function androidAvailable(){return !!window.MaoozAndroid&&typeof window.MaoozAndroid.requestNotifications==='function';}
function syncAndroidReminders(){if(!androidAvailable())return;const now=new Date();const jobs=[];if(state.settings.notifications===false){window.MaoozAndroid.syncReminders('[]');return;}for(const c of state.timetable||[]){const reminder=Number(c.reminder||0);if(reminder<=0)continue;let base=new Date(now);let found=null;for(let i=0;i<14;i++){const d=new Date(now);d.setDate(now.getDate()+i);if(c.startDate&&today(d)<c.startDate)continue;if(c.endDate&&today(d)>c.endDate)continue;if(d.getDay()!==Number(c.day))continue;const [hh,mm]=String(c.start||'00:00').split(':').map(Number);d.setHours(hh||0,mm||0,0,0);d.setMinutes(d.getMinutes()-reminder);if(d.getTime()<=Date.now())continue;found=d;break;}if(!found)continue;const co=courseById(c.courseId);const end=c.endDate?new Date(c.endDate+'T23:59:59').getTime():0;jobs.push({id:String(c.id),fireAt:found.getTime(),periodMs:604800000,endAt:end,title:'Upcoming class',message:`${co?.name||'Class'} starts in ${reminder} minutes${c.room?' · '+c.room:''}`,quietHours:!!state.settings.quietHours,quietStart:state.settings.quietStart,quietEnd:state.settings.quietEnd});}window.MaoozAndroid.syncReminders(JSON.stringify(jobs));}
function quickAdd(){modal('Quick Add','Fast entry without opening a module first.',`<div class="grid g2">${btn('＋ Course','closeModal();openCourseModal()','btn soft')}${btn('✓ Task','closeModal();openTaskModal()','btn soft')}${btn('⌁ Assessment','closeModal();openAssessmentModal()','btn soft')}${btn('◫ Attendance','closeModal();openAttendanceModal()','btn soft')}${btn('✦ Note','closeModal();openNoteModal()','btn soft')}${btn('↗ URL','closeModal();openResourceModal()','btn soft')}${btn('◉ Study Session','closeModal();openStudyModal()','btn soft')}${btn('□ Calendar Event','closeModal();openEventModal()','btn soft')}${btn('🗓 Class','closeModal();openTimetableModal()','btn soft')}</div>`,'<button class="btn" onclick="closeModal()">Close</button>');}
function openAcademicModal(){const p=state.profile;modal('Academic Profile','Customize identity and the academic foundation used by the rest of MaoozOS.',`<div class="form-grid"><div class="field"><label>Display name</label><input id="f_name" value="${esc(p.name)}" placeholder="Muhammad Maooz"></div><div class="field"><label>Greeting</label><input id="f_greet" value="${esc(p.greeting||dynamicGreeting())}"></div><div class="field"><label>University</label><input id="f_uni" value="${esc(p.university)}" placeholder="FAST-NUCES"></div><div class="field"><label>Campus</label><input id="f_campus" value="${esc(p.campus)}" placeholder="Peshawar"></div><div class="field"><label>Department</label><input id="f_dept" value="${esc(p.department)}"></div><div class="field"><label>Degree</label><input id="f_degree" value="${esc(p.degree)}" placeholder="BS Computer Science"></div><div class="field"><label>Batch</label><input id="f_batch" value="${esc(p.batch)}"></div><div class="field"><label>Current semester</label><input id="f_cursem" type="number" min="1" max="20" value="${Number(p.currentSemester||1)}"></div><div class="field"><label>Student ID / Roll No. (optional)</label><input id="f_roll" value="${esc(p.rollNo)}"></div><div class="field"><label>Advisor (optional)</label><input id="f_adv" value="${esc(p.advisor)}"></div><div class="field"><label>Expected graduation (optional)</label><input id="f_grad" value="${esc(p.expectedGraduation)}"></div></div><div class="form-help" style="margin-top:10px">Nothing academic is hard-coded. Grading profiles, courses, credits, attendance rules and semester records can be configured separately.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAcademic()">Save profile</button>`)}
function saveAcademic(){state.profile.name=val('f_name').trim()||'Student';state.profile.greeting=val('f_greet').trim()||dynamicGreeting();state.profile.university=val('f_uni').trim();state.profile.campus=val('f_campus').trim();state.profile.department=val('f_dept').trim();state.profile.degree=val('f_degree').trim();state.profile.batch=val('f_batch').trim();state.profile.currentSemester=Math.max(1,Number(val('f_cursem'))||1);state.profile.rollNo=val('f_roll').trim();state.profile.advisor=val('f_adv').trim();state.profile.expectedGraduation=val('f_grad').trim();log('Updated academic profile');closeModal();refresh();toast('Profile saved','Academic identity and personalization were saved locally.');}
function openSemesterModal(id=''){const s=id?state.semesters.find(x=>x.id===id):{name:'',academicYear:'',start:'',end:'',status:'upcoming',summaryOnly:false,finalized:false};modal(id?'Edit Semester':'Add Semester','Semester records can be detailed or historical summaries.',`<div class="form-grid"><div class="field"><label>Semester name</label><input id="f_sn" value="${esc(s.name)}" placeholder="Semester 1"></div><div class="field"><label>Academic year</label><input id="f_sy" value="${esc(s.academicYear)}" placeholder="2026–27"></div><div class="field"><label>Start</label><input id="f_ss" type="date" value="${esc(s.start)}"></div><div class="field"><label>End</label><input id="f_se" type="date" value="${esc(s.end)}"></div><div class="field"><label>Status</label><select id="f_st"><option value="upcoming" ${s.status==='upcoming'?'selected':''}>Upcoming</option><option value="active" ${s.status==='active'?'selected':''}>Active</option><option value="completed" ${s.status==='completed'?'selected':''}>Completed</option><option value="archived" ${s.status==='archived'?'selected':''}>Archived</option></select></div><div class="field"><label>History mode</label><select id="f_sum"><option value="detail" ${!s.summaryOnly?'selected':''}>Detailed</option><option value="summary" ${s.summaryOnly?'selected':''}>Historical summary</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveSemester('${id}')">Save</button>`)}
function saveSemester(id){const name=val('f_sn').trim(),start=val('f_ss'),end=val('f_se');if(!name)return userError('Semester name required','A semester needs a name so other records can reference it.','Enter something like Semester 1.');if(start&&end&&end<start)return userError('Invalid semester dates','The end date is before the start date.','Choose an end date on or after the start date.');let s=id?state.semesters.find(x=>x.id===id):{id:uid('sem'),finalized:false};Object.assign(s,{name,academicYear:val('f_sy').trim(),start,end,status:val('f_st'),summaryOnly:val('f_sum')==='summary'});if(!id)state.semesters.push(s);log(`${id?'Edited':'Created'} ${name}`);closeModal();refresh();toast('Semester saved','The semester record is stored locally.');}
function openCourseModal(id='',semId=''){const c=id?courseById(id):{name:'',code:'',credits:3,instructor:'',section:'',semesterId:semId||currentSemester()?.id||state.semesters[0]?.id||'',color:state.settings.accent,icon:'◈',grade:'',gradePoint:'',countGpa:true,countCgpa:true,gradingProfileId:state.activeGradingProfile};modal(id?'Edit Course':'Add Course','Simple to create; powerful after saving.',`<div class="form-grid"><div class="field full"><label>Course Name</label><input id="f_cn" value="${esc(c.name)}" placeholder="Programming Fundamentals"></div><div class="field"><label>Course Code</label><input id="f_cc" value="${esc(c.code)}" placeholder="CS1001"></div><div class="field"><label>Credit Hours</label><input id="f_cr" type="number" min="0.1" step="0.1" value="${esc(c.credits)}"></div><div class="field"><label>Instructor</label><input id="f_ci" value="${esc(c.instructor)}"></div><div class="field"><label>Section</label><input id="f_cs" value="${esc(c.section)}"></div><div class="field"><label>Semester</label><select id="f_csem">${state.semesters.map(s=>`<option value="${s.id}" ${s.id===c.semesterId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Color</label><input id="f_ccolor" type="color" value="${esc(c.color||state.settings.accent)}"></div><div class="field"><label>Icon</label><input id="f_cicon" value="${esc(c.icon||'◈')}" maxlength="4"></div></div><div class="alert info" style="margin-top:11px">Grade and GPA data can be configured later. Official grades should never be guessed.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCourse('${id}')">Save Course</button>`)}
function saveCourse(id){const name=val('f_cn').trim(),credits=Number(val('f_cr'));if(!name)return userError('Course name required','The course must have a name so it can be identified everywhere.','Enter the course name.');if(!Number.isFinite(credits)||credits<=0)return userError('Credit hours invalid','GPA/CGPA needs a positive credit value.','Enter a value such as 1, 2, 3 or 4.');const sem=val('f_csem');let dup=state.courses.find(c=>c.id!==id&&c.semesterId===sem&&c.name.trim().toLowerCase()===name.toLowerCase());if(dup&&!confirm(`A similar course already exists: ${dup.name}. Create another record anyway?`))return;let c=id?courseById(id):{id:uid('course'),grade:'',gradePoint:'',countGpa:true,countCgpa:true,gradingProfileId:state.activeGradingProfile};Object.assign(c,{name,code:val('f_cc').trim(),credits,instructor:val('f_ci').trim(),section:val('f_cs').trim(),semesterId:sem,color:val('f_ccolor'),icon:val('f_cicon').trim()||'◈'});if(!id)state.courses.push(c);log(`${id?'Edited':'Created'} course: ${name}`);closeModal();refresh();toast('Course saved',`${name} is now linked to its semester.`);}
function openTaskModal(id=''){const t=id?state.tasks.find(x=>x.id===id):{title:'',courseId:currentCourseId()||'',type:'Assignment',dueDate:today(),dueTime:'23:59',priority:'normal',status:'not-started',description:'',tags:[]};modal(id?'Edit Task':'Add Task','Tasks are stored separately and shown on Dashboard and Calendar.',`<div class="form-grid"><div class="field full"><label>Title</label><input id="f_tt" value="${esc(t.title)}" placeholder="Complete PF Assignment 2"></div><div class="field"><label>Course</label><select id="f_tc"><option value="">Personal / none</option>${state.courses.map(c=>`<option value="${c.id}" ${c.id===t.courseId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Type</label><input id="f_ty" value="${esc(t.type||'Assignment')}" placeholder="Assignment"></div><div class="field"><label>Due date</label><input id="f_td" type="date" value="${esc(t.dueDate||today())}"></div><div class="field"><label>Due time</label><input id="f_tm" type="time" value="${esc(t.dueTime||'23:59')}"></div><div class="field"><label>Priority</label><select id="f_tp"><option ${t.priority==='low'?'selected':''}>low</option><option ${t.priority==='normal'?'selected':''}>normal</option><option ${t.priority==='high'?'selected':''}>high</option><option ${t.priority==='critical'?'selected':''}>critical</option></select></div><div class="field"><label>Status</label><select id="f_ts"><option value="not-started" ${t.status==='not-started'?'selected':''}>Not Started</option><option value="in-progress" ${t.status==='in-progress'?'selected':''}>In Progress</option><option value="completed" ${t.status==='completed'?'selected':''}>Completed</option><option value="on-hold" ${t.status==='on-hold'?'selected':''}>On Hold</option><option value="cancelled" ${t.status==='cancelled'?'selected':''}>Cancelled</option></select></div><div class="field full"><label>Description</label><textarea id="f_tdsc">${esc(t.description||'')}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask('${id}')">Save Task</button>`)}

function saveTask(id){const title=val('f_tt').trim(),due=val('f_td');if(!title)return userError('Task title required','The task needs a name for the planner.','Enter a clear title.');if(due&&Number.isNaN(new Date(due+'T00:00:00').getTime()))return userError('Invalid due date','The browser could not parse the selected date.','Choose a date using the date picker.');let t=id?state.tasks.find(x=>x.id===id):{id:uid('task'),createdAt:new Date().toISOString(),history:[]};if(!Array.isArray(t.history))t.history=[];t.history.push({time:new Date().toISOString(),status:val('f_ts'),dueDate:due});Object.assign(t,{title,courseId:val('f_tc'),type:val('f_ty').trim()||'Task',dueDate:due,dueTime:val('f_tm'),priority:val('f_tp'),status:val('f_ts'),description:val('f_tdsc')});if(!id)state.tasks.unshift(t);log(`${id?'Edited':'Created'} task: ${title}`);closeModal();refresh();toast('Task saved',t.status==='completed'?'Marked complete.':'Added to your planner.');}
function openAssessmentModal(id=''){const a=id?state.assessments.find(x=>x.id===id):{name:'',type:'Quiz',courseId:currentCourseId(),max:100,obtained:'',weight:10,status:'graded',date:today()};modal(id?'Edit Assessment':'Add Assessment','Assessment marks remain raw data; GPA rules are applied separately.',`<div class="form-grid"><div class="field"><label>Name</label><input id="f_an" value="${esc(a.name)}" placeholder="Quiz 1"></div><div class="field"><label>Type</label><input id="f_at" value="${esc(a.type||'Quiz')}"></div><div class="field"><label>Course</label><select id="f_ac">${state.courses.map(c=>`<option value="${c.id}" ${c.id===a.courseId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="f_ad" type="date" value="${esc(a.date||today())}"></div><div class="field"><label>Maximum Marks</label><input id="f_am" type="number" min="0.01" step="0.01" value="${esc(a.max)}"></div><div class="field"><label>Obtained Marks</label><input id="f_ao" type="number" step="0.01" value="${a.obtained===null?'':esc(a.obtained)}"></div><div class="field"><label>Weight %</label><input id="f_aw" type="number" min="0" step="0.01" value="${esc(a.weight||0)}"></div><div class="field"><label>Status</label><select id="f_ast"><option value="graded">Graded</option><option value="pending" ${a.status==='pending'?'selected':''}>Pending</option><option value="excused" ${a.status==='excused'?'selected':''}>Excused</option><option value="dropped" ${a.status==='dropped'?'selected':''}>Dropped</option><option value="absent" ${a.status==='absent'?'selected':''}>Absent</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAssessment('${id}')">Save</button>`)}
function saveAssessment(id){const name=val('f_an').trim(),max=Number(val('f_am')),obt=val('f_ao');if(!name)return userError('Assessment name required','The assessment needs a name.','Enter something like Quiz 1.');if(!Number.isFinite(max)||max<=0)return userError('Maximum marks invalid','Maximum marks must be positive.','Enter the actual maximum marks.');if(obt!==''&&(Number(obt)<0||Number(obt)>max))return userError('Marks are invalid',`Obtained marks must be between 0 and ${max}.`,'Use the configured maximum or enable a separate extra-credit rule.');const courseId=val('f_ac');if(!courseId)return userError('Course required','An assessment must belong to a course for academic calculations.','Add a course first.');let a=id?state.assessments.find(x=>x.id===id):{id:uid('assess'),history:[]};Object.assign(a,{name,type:val('f_at').trim()||'Assessment',courseId,date:val('f_ad'),max,obtained:obt===''?'':Number(obt),weight:Math.max(0,Number(val('f_aw'))||0),status:val('f_ast')});if(!id)state.assessments.unshift(a);const sum=state.assessments.filter(x=>x.courseId===courseId).reduce((n,x)=>n+(Number(x.weight)||0),0);if(sum>100.0001){toast('Assessment weights exceed 100%',`Current total for this course is ${sum.toFixed(2)}%. Review the weights before treating the course score as final.`,'warn');}log(`${id?'Edited':'Created'} assessment: ${name}`);closeModal();refresh();toast('Assessment saved','Raw marks and weight are stored locally.');}
function openAttendanceModal(id=''){const a=id?state.attendance.find(x=>x.id===id):{date:today(),courseId:currentCourseId(),status:'present',type:'Lecture',note:''};modal(id?'Edit Attendance':'Record Attendance','No record is never treated as absent.',`<div class="form-grid"><div class="field"><label>Date</label><input id="f_rd" type="date" value="${esc(a.date)}"></div><div class="field"><label>Course</label><select id="f_rc">${state.courses.map(c=>`<option value="${c.id}" ${c.id===a.courseId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="f_rs"><option value="present">Present</option><option value="absent" ${a.status==='absent'?'selected':''}>Absent</option><option value="late" ${a.status==='late'?'selected':''}>Late</option><option value="excused" ${a.status==='excused'?'selected':''}>Excused</option><option value="cancelled" ${a.status==='cancelled'?'selected':''}>Cancelled</option></select></div><div class="field"><label>Type</label><input id="f_rt" value="${esc(a.type||'Lecture')}"></div><div class="field full"><label>Note</label><input id="f_rn" value="${esc(a.note||'')}" placeholder="Optional note"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAttendance('${id}')">Save</button>`)}
function saveAttendance(id){const date=val('f_rd'),courseId=val('f_rc'),status=val('f_rs');if(!date||!courseId)return userError('Attendance incomplete','Date and course are required for an attendance record.','Fill both fields.');const dup=state.attendance.find(a=>a.id!==id&&a.date===date&&a.courseId===courseId&&a.type===val('f_rt'));if(dup&&status!==dup.status&&!confirm('An attendance record already exists for this course/date/type. Edit it instead?'))return;let a=id?state.attendance.find(x=>x.id===id):{id:uid('att')};Object.assign(a,{date,courseId,status,type:val('f_rt').trim()||'Lecture',note:val('f_rn').trim()});if(!id)state.attendance.push(a);log(`${id?'Edited':'Recorded'} attendance`);closeModal();refresh();toast('Attendance saved',status==='present'?'Marked Present.':'Attendance record updated.');}
function openNoteModal(id=''){const n=id?state.notes.find(x=>x.id===id):{title:'',courseId:'',topic:'',content:'',tags:''};modal(id?'Edit Note':'Add Note','Notes save locally and can connect to courses and resources.',`<div class="form-grid"><div class="field full"><label>Title</label><input id="f_nt" value="${esc(n.title)}" placeholder="Pointers"></div><div class="field"><label>Course</label><select id="f_nc"><option value="">General</option>${state.courses.map(c=>`<option value="${c.id}" ${c.id===n.courseId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Topic</label><input id="f_ntopic" value="${esc(n.topic||'')}"></div><div class="field full"><label>Content</label><textarea id="f_nbody" placeholder="Write your notes…">${esc(n.content||'')}</textarea></div><div class="field full"><label>Tags</label><input id="f_ntags" value="${esc(n.tags||'')}" placeholder="#exam #important"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNote('${id}')">Save Note</button>`)}
function saveNote(id){const title=val('f_nt').trim(),content=val('f_nbody');if(!title&& !content)return userError('Note is empty','There is no title or content to save.','Add something first or cancel.');let n=id?state.notes.find(x=>x.id===id):{id:uid('note'),versions:[]};n.versions=n.versions||[];n.versions.unshift({time:new Date().toISOString(),title:n.title||'',content:n.content||''});n.versions=n.versions.slice(0,15);Object.assign(n,{title:title||'Untitled Note',courseId:val('f_nc'),topic:val('f_ntopic').trim(),content,tags:val('f_ntags').trim(),updatedAt:new Date().toISOString()});if(!id)state.notes.unshift(n);log(`${id?'Edited':'Created'} note: ${n.title}`);closeModal();refresh();toast('Note saved','Your note is stored locally.');}
function openResourceModal(id=''){const r=id?state.resources.find(x=>x.id===id):{url:'',name:'',type:'',icon:'',courseIds:[],tags:''};modal(id?'Edit Resource':'Add Resource','Paste a URL; known sites are recognized offline and every label is editable.',`<div class="form-grid"><div class="field full"><label>URL</label><input id="f_url" value="${esc(r.url||'')}" placeholder="https://github.com/…" oninput="previewUrl(this.value)"></div><div class="field"><label>Name</label><input id="f_un" value="${esc(r.name||'')}" placeholder="Auto from URL"></div><div class="field"><label>Type / subtype</label><input id="f_ut" value="${esc(r.type||'')}" placeholder="Video / Repository / Document"></div><div class="field"><label>Icon</label><input id="f_ui" value="${esc(r.icon||'')}" maxlength="4"></div><div class="field"><label>Tags</label><input id="f_ug" value="${esc(r.tags||'')}" placeholder="#important #coding"></div><div class="field full"><label>Course connections</label><select id="f_uc" multiple size="4">${state.courses.map(c=>`<option value="${c.id}" ${(r.courseIds||[]).includes(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><div id="urlPreview" class="alert info">Paste a URL to preview its local recognition.</div></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveResource('${id}')">Save Resource</button>`);if(r.url)previewUrl(r.url)}
function recognizeURL(url){try{const u=new URL(url);const host=u.hostname.toLowerCase().replace(/^www\./,'');const custom=(state.settings.customUrlRules||[]).find(r=>host===r.domain||host.endsWith('.'+r.domain));if(custom)return {name:custom.name,type:custom.type||'Website',icon:custom.icon||'🌐'};const match=URL_RULES.find(r=>host===r[0]||host.endsWith('.'+r[0]));if(!match)return {name:host||'Website',type:'Website',icon:'🌐'};let type=match[2],name=match[1],icon=match[3];if(name==='YouTube'){if(u.pathname.includes('/playlist'))type='Playlist';else if(u.pathname.includes('/shorts'))type='Short';else if(u.pathname.includes('/channel')||u.pathname.includes('/@'))type='Channel';}else if(name==='GitHub'){if(u.pathname.split('/').filter(Boolean).length>=2)type='Repository';}else if(name==='Google Drive'){if(u.pathname.includes('/folders/'))type='Folder';}else if(name==='Google Docs'){if(u.pathname.includes('/spreadsheets/'))type='Spreadsheet';else if(u.pathname.includes('/presentation/'))type='Presentation';}return {name,type,icon};}catch{return null}}
function previewUrl(url){const el=document.getElementById('urlPreview');if(!el)return;const r=recognizeURL(url);el.innerHTML=r?`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">${esc(r.icon)}</span><div><strong>${esc(r.name)}</strong><div class="tiny muted">${esc(r.type)} · recognized locally without internet</div></div></div>`:`<div class="alert warn">This does not look like a standard web URL yet. The app will not invent a service label.</div>`;if(r){if(!val('f_un'))document.getElementById('f_un').value=r.name;if(!val('f_ut'))document.getElementById('f_ut').value=r.type;if(!val('f_ui'))document.getElementById('f_ui').value=r.icon}}
function saveResource(id){const url=val('f_url').trim();if(!/^https?:\/\//i.test(url))return userError('URL is not valid for this resource system','Only normal http:// and https:// web links are accepted.','Add the complete web address.');const rdet=recognizeURL(url),name=val('f_un').trim()||rdet?.name||new URL(url).hostname,type=val('f_ut').trim()||rdet?.type||'Website',icon=val('f_ui').trim()||rdet?.icon||'🌐';const selected=[...document.getElementById('f_uc').selectedOptions].map(o=>o.value);const dup=state.resources.find(x=>x.id!==id&&x.url===url);if(dup&&!confirm('The exact URL already exists. Create another entry anyway?'))return;let r=id?state.resources.find(x=>x.id===id):{id:uid('res'),createdAt:new Date().toISOString(),history:[]};Object.assign(r,{url,name,type,icon,tags:val('f_ug').trim(),courseIds:selected,updatedAt:new Date().toISOString()});if(!id)state.resources.unshift(r);log(`${id?'Edited':'Added'} resource: ${name}`);closeModal();refresh();toast('Resource saved',`${name} (${type}) is stored locally and remains editable.`);}
function openCustomRuleModal(){modal('Custom URL Rule','Teach MaoozOS about a domain you use frequently.',`<div class="form-grid"><div class="field"><label>Domain</label><input id="f_rd" placeholder="lms.example.edu"></div><div class="field"><label>Name</label><input id="f_rn2" placeholder="My University LMS"></div><div class="field"><label>Type</label><input id="f_rt2" placeholder="LMS"></div><div class="field"><label>Icon</label><input id="f_ri2" value="🎓" maxlength="4"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCustomRule()">Save Rule</button>`)}
function saveCustomRule(){const domain=val('f_rd').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'');const name=val('f_rn2').trim();if(!domain||!name)return userError('Rule incomplete','A domain and display name are required.','Fill both fields.');state.settings.customUrlRules=state.settings.customUrlRules||[];const idx=state.settings.customUrlRules.findIndex(r=>r.domain===domain);const item={domain,name,type:val('f_rt2').trim()||'Website',icon:val('f_ri2').trim()||'🌐'};if(idx>=0)state.settings.customUrlRules[idx]=item;else state.settings.customUrlRules.push(item);log('Updated custom URL rule: '+domain);closeModal();refresh();toast('URL rule saved','Future matching links can use your custom label and icon.');}
function openStudyModal(){modal('Study Session','This records actual study time and never alters planned time.',`<div class="form-grid"><div class="field"><label>Course</label><select id="f_sc"><option value="">General</option>${state.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Topic</label><input id="f_stop" placeholder="Pointers"></div><div class="field"><label>Date</label><input id="f_sdate" type="date" value="${today()}"></div><div class="field"><label>Minutes</label><input id="f_smins" type="number" min="1" value="30"></div><div class="field full"><label>Notes</label><input id="f_snote" placeholder="Optional"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStudy()">Save Session</button>`)}
function saveStudy(){const mins=Number(val('f_smins'));if(!Number.isFinite(mins)||mins<=0)return userError('Study duration invalid','Actual study time must be positive.','Enter a duration greater than zero.');state.studySessions.unshift({id:uid('study'),courseId:val('f_sc'),topic:val('f_stop').trim(),date:val('f_sdate'),minutes:mins,note:val('f_snote').trim()});log('Recorded study session');closeModal();refresh();toast('Study saved',`${mins} minutes recorded.`);}
function openEventModal(){modal('Add Calendar Event','Personal events live in Calendar while academic items remain owned by their modules.',`<div class="form-grid"><div class="field full"><label>Title</label><input id="f_et" placeholder="Study group"></div><div class="field"><label>Date</label><input id="f_ed" type="date" value="${today()}"></div><div class="field"><label>Time</label><input id="f_etime" type="time"></div><div class="field full"><label>URL (optional)</label><input id="f_eurl" placeholder="https://…"></div><div class="field full"><label>Notes</label><textarea id="f_enote"></textarea></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEvent()">Save Event</button>`)}
function saveEvent(){const title=val('f_et').trim(),date=val('f_ed');if(!title||!date)return userError('Event incomplete','A title and date are required.','Fill both fields.');state.events.push({id:uid('event'),title,date,time:val('f_etime'),url:val('f_eurl').trim(),notes:val('f_enote').trim()});log('Created event: '+title);closeModal();refresh();toast('Event saved','Your calendar event was added.');}
function openTimetableModal(id=''){const c=id?state.timetable.find(x=>x.id===id):{courseId:currentCourseId(),day:1,start:'10:00',end:'11:30',room:'',instructor:'',type:'Lecture',startDate:'',endDate:'',reminder:15};modal(id?'Edit Class':'Add Class','The timetable is the source for weekly classes, Dashboard class priority and reminders.',`<div class="form-grid"><div class="field full"><label>Course</label><select id="f_tc2">${state.courses.map(x=>`<option value="${x.id}" ${x.id===c.courseId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Day</label><select id="f_tday">${DAYS.map((d,i)=>`<option value="${i}" ${Number(c.day)===i?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Type</label><input id="f_ttype" value="${esc(c.type||'Lecture')}"></div><div class="field"><label>Start</label><input id="f_tstart" type="time" value="${esc(c.start||'10:00')}"></div><div class="field"><label>End</label><input id="f_tend" type="time" value="${esc(c.end||'11:30')}"></div><div class="field"><label>Room</label><input id="f_troom" value="${esc(c.room||'')}"></div><div class="field"><label>Instructor</label><input id="f_tinst" value="${esc(c.instructor||'')}"></div><div class="field"><label>Start date</label><input id="f_tsdate" type="date" value="${esc(c.startDate||'')}"></div><div class="field"><label>End date</label><input id="f_tedate" type="date" value="${esc(c.endDate||'')}"></div><div class="field"><label>Reminder minutes</label><input id="f_trem" type="number" min="0" value="${Number(c.reminder||0)}"></div></div><div class="alert info" style="margin-top:10px">Cancelled/rescheduled individual class occurrences can be added later without changing the recurring rule.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTimetable('${id}')">Save Class</button>`)}
function saveTimetable(id){const start=val('f_tstart'),end=val('f_tend'),courseId=val('f_tc2'),day=Number(val('f_tday'));if(!courseId)return userError('Course required','A class needs a course connection.','Create a course first.');if(!start||!end)return userError('Class time incomplete','Both start and end times are needed.','Choose both times.');if(end<=start)return userError('Invalid class time','The end time must be after the start time.','Correct the time range.');const sd=val('f_tsdate'),ed=val('f_tedate');if(sd&&ed&&ed<sd)return userError('Invalid class dates','The end date is before the start date.','Correct the date range.');const duplicate=state.timetable.find(x=>x.id!==id&&x.courseId===courseId&&Number(x.day)===day&&x.start===start&&x.end===end&&x.startDate===sd&&x.endDate===ed);if(duplicate&&!confirm('A matching class already exists. Add another anyway?'))return;let c=id?state.timetable.find(x=>x.id===id):{id:uid('class')};Object.assign(c,{courseId,day,start,end,room:val('f_troom').trim(),instructor:val('f_tinst').trim(),type:val('f_ttype').trim()||'Lecture',startDate:sd,endDate:ed,reminder:Math.max(0,Number(val('f_trem'))||0)});if(!id)state.timetable.push(c);log(`${id?'Edited':'Created'} timetable class`);closeModal();refresh();toast('Class saved','Timetable, Dashboard and reminders now use this class.');}
function openGradingProfileModal(){const g=defaultGradeProfile();modal('New Grading Profile','Use presets as a starting point; edit the scale later. Relative grading is never guessed.',`<div class="form-grid"><div class="field full"><label>Profile name</label><input id="f_gname" placeholder="FAST Relative 2026–27"></div><div class="field"><label>Method</label><select id="f_gmethod"><option>absolute</option><option>relative</option><option>pass/fail</option><option>custom</option></select></div><div class="field"><label>Rounding decimals</label><input id="f_ground" type="number" min="0" max="6" value="2"></div></div><div class="form-help" style="margin-top:10px">Relative grading remains manual unless you configure an exact official formula. MaoozOS never invents a relative-grade curve.</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveGradingProfile()">Save Profile</button>`)}
function saveGradingProfile(){const name=val('f_gname').trim();if(!name)return userError('Profile name required','A grading profile needs a clear versioned name.','Enter a name.');const g=defaultGradeProfile();g.id=uid('gp');g.name=name;g.method=val('f_gmethod');g.rounding=Math.max(0,Math.min(6,Number(val('f_ground'))||2));state.gradingProfiles.push(g);state.activeGradingProfile=g.id;log('Created grading profile: '+name);closeModal();refresh();toast('Grading profile saved','The new profile is now active for new courses.');}
function saveGrade(courseId){const grade=val('grade_'+courseId).trim(),gp=val('gp_'+courseId);const c=courseById(courseId);if(!c)return;const profile=state.gradingProfiles.find(g=>g.id===c.gradingProfileId)||state.gradingProfiles.find(g=>g.id===state.activeGradingProfile);if(grade&&!Number.isFinite(Number(gp))&&profile?.method==='absolute'){const mapped=profile.scale.find(r=>String(r[0]).toUpperCase()===grade.toUpperCase());if(mapped)c.gradePoint=Number(mapped[1]);else return userError('Unknown grade','The entered grade does not exist in the selected scale.','Choose a configured grade or edit the grading profile.');}else c.gradePoint=gp===''?'':Number(gp);c.grade=grade;c.gradingProfileId=profile?.id||state.activeGradingProfile;c.lastGradeChange=new Date().toISOString();log('Updated grade: '+c.name);refresh();toast('Grade saved','The authoritative GPA engine will use this grade and credit value.');}
function finalizeSemester(id){const s=state.semesters.find(x=>x.id===id);if(!s)return;const g=semesterGPA(id);if(g===null)return userError('Semester cannot be finalized','One or more GPA-counted courses do not have valid grade points.','Enter official grades or explicitly exclude the courses from GPA.');const cr=coursesForSem(id).reduce((n,c)=>n+(Number(c.credits)||0),0);s.finalized=true;s.status='completed';s.snapshot={gpa:g,credits:cr,gradingProfileIds:coursesForSem(id).map(c=>c.gradingProfileId||state.activeGradingProfile),date:new Date().toISOString()};log('Finalized '+s.name);refresh();toast('Semester finalized','A historical snapshot was saved.');}
function reopenSemester(id){const s=state.semesters.find(x=>x.id===id);if(!s)return;s.finalized=false;s.status='active';s.snapshot=null;log('Reopened '+s.name);refresh();toast('Semester reopened','Historical editing is available again.');}
function openSemesterDetails(id){const s=state.semesters.find(x=>x.id===id);if(!s)return;const cs=coursesForSem(id),g=semesterGPA(id);modal(s.name,'Semester overview, grades and protections.',`<div class="stat-grid"><div class="card stat"><div class="stat-label">GPA</div><div class="stat-value">${g==null?'—':g.toFixed(2)}</div></div><div class="card stat"><div class="stat-label">Credits</div><div class="stat-value">${cs.reduce((n,c)=>n+Number(c.credits||0),0)}</div></div><div class="card stat"><div class="stat-label">Courses</div><div class="stat-value">${cs.length}</div></div><div class="card stat"><div class="stat-label">Status</div><div class="stat-value" style="font-size:18px">${esc(s.status)}</div></div></div><div class="section-head"><div class="section-title">Courses</div>${btn('＋ Add Course',`closeModal();openCourseModal('','${id}')`,'btn small')}</div><div class="list">${cs.length?cs.map(c=>`<div class="item"><div class="item-left"><div class="item-icon" style="background:${esc(c.color||state.settings.accent)}22">${esc(c.icon||'◈')}</div><div class="item-main"><div class="item-title">${esc(c.name)}</div><div class="item-sub">${esc(c.code||'')} · ${Number(c.credits)} credits · Grade ${esc(c.grade||'—')}</div></div></div><div class="item-right">${btn('Edit',`closeModal();openCourseModal('${c.id}')`,'btn small')}</div></div>`).join(''):`<div class="empty"><h4>No courses yet</h4><p>Add courses to build this semester.</p></div>`}</div>`,`${s.finalized?btn('Reopen','reopenSemester(\''+s.id+'\');closeModal()','btn'):btn('Finalize Semester','finalizeSemester(\''+s.id+'\');closeModal()','btn primary')}<button class="btn" onclick="closeModal()">Close</button>`)}
function renderDashboard(){const p=state.profile,sem=currentSemester(),classes=classesToday(),tasks=state.tasks.filter(t=>t.status!=='completed'&&t.status!=='cancelled'&&t.dueDate).sort((a,b)=>(a.dueDate+a.dueTime).localeCompare(b.dueDate+b.dueTime)),todayTasks=tasks.filter(t=>t.dueDate===today()),assToday=state.assessments.filter(a=>a.date===today()),now=new Date(),next=nextClass();const g=sem?semesterGPA(sem.id):null,cg=cgpa(),study=state.studySessions.reduce((n,s)=>n+Number(s.minutes||0),0);return pageHead('Command Center','Dashboard',`${state.settings.showGreeting===false?'':esc(p.greeting||dynamicGreeting())+' · '}${p.name||'Student'} · <span id="liveClock">${new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',hour12:!state.settings.clock24})}</span>`,btn('＋ Quick Add','quickAdd()','btn primary'))+`<div class="card hero hover"><div><div class="hero-kicker"><span class="pulse"></span>${esc(sem?.name||'Set up your first semester')}</div><div class="hero-name">${esc(p.name||'Welcome to MaoozOS')}</div><div class="hero-meta">${esc(p.university||'Your university')} ${p.campus?'· '+esc(p.campus):''} ${p.degree?'· '+esc(p.degree):''}<br>${sem?esc(sem.name):'Add a semester to start your academic workspace.'}</div><div class="hero-actions">${btn('＋ Class','openTimetableModal()','btn primary')}${btn('＋ Deadline','openTaskModal()','btn soft')}${btn('＋ URL','openResourceModal()','btn soft')}${btn('Start Tour','startTour(true)','btn')}${btn('Settings','showPage(\'settings\')','btn')}</div></div><div class="hero-side"><div class="orb"><span>MAOOZOS<br>LOCAL • PRIVATE</span></div></div></div><div class="section-head"><div class="section-title">Priority now</div><div class="section-note">Most important first</div></div><div class="priority-grid"><div class="card priority-card hover"><div class="split"><div><div class="eyebrow">Today's Classes</div><div class="priority-big" style="margin-top:7px">${classes.length}</div><div class="muted tiny">All scheduled classes for today</div></div>${next?`<span class="pill success">NEXT ${fmtTime(next.start)}</span>`:`<span class="pill">No class next</span>`}</div><div class="list" style="margin-top:13px">${classes.length?classes.slice(0,5).map(c=>classRow(c)).join(''):`<div class="empty"><h4>No classes today</h4><p>Your timetable is clear. Add a class from Timetable.</p></div>`}</div></div><div class="card priority-card hover"><div class="split"><div><div class="eyebrow">Deadlines & Assessments</div><div class="priority-big" style="margin-top:7px">${todayTasks.length+assToday.length}</div><div class="muted tiny">Due today</div></div><span class="pill ${todayTasks.length+assToday.length?'danger':''}">${todayTasks.length+assToday.length?'ATTENTION':'CLEAR'}</span></div><div class="list" style="margin-top:13px">${[...todayTasks.slice(0,3).map(t=>`<div class="item"><div class="item-left"><div class="item-icon">✓</div><div class="item-main"><div class="item-title">${esc(t.title)}</div><div class="item-sub">${esc(t.type)} · ${esc(t.dueTime||'today')}</div></div></div><span class="pill ${t.priority==='high'||t.priority==='critical'?'danger':'warn'}">${esc(t.priority)}</span></div>`),...assToday.slice(0,3).map(a=>`<div class="item"><div class="item-left"><div class="item-icon">⌁</div><div class="item-main"><div class="item-title">${esc(a.name)}</div><div class="item-sub">${esc(courseById(a.courseId)?.name||'Course')} · ${esc(a.type)}</div></div></div><span class="pill danger">Today</span></div>`)].join('')||`<div class="empty"><h4>No deadlines today</h4><p>Your top priority area is clear.</p></div>`}</div></div></div><div class="section-head"><div class="section-title">Next up</div><div class="section-note">Classes and deadlines first</div></div><div class="grid g3"><div class="card hover"><div class="eyebrow">Next class</div>${next?`<div class="metric" style="margin-top:8px">${esc(courseById(next.courseId)?.name||'Class')}</div><div class="muted tiny">${fmtTime(next.start)}–${fmtTime(next.end)} · ${esc(next.room||'Room not set')}</div>`:`<div class="muted" style="margin-top:10px">No upcoming class in the current timetable.</div>`}</div><div class="card hover"><div class="eyebrow">Current semester GPA</div><div class="metric" style="margin-top:8px">${g==null?'—':g.toFixed(2)}</div><div class="muted tiny">Only valid configured grades and credits are used.</div></div><div class="card hover"><div class="eyebrow">Overall CGPA</div><div class="metric" style="margin-top:8px">${cg==null?'—':cg.toFixed(2)}</div><div class="muted tiny">Historical and current completed grade records.</div></div></div><div class="section-head"><div class="section-title">Secondary overview</div><div class="section-note">Useful, lower priority</div></div><div class="stat-grid"><div class="card stat hover"><div class="stat-label">Open tasks</div><div class="stat-value">${tasks.length}</div><div class="stat-foot">Incomplete planner items</div></div><div class="card stat hover"><div class="stat-label">Courses</div><div class="stat-value">${state.courses.length}</div><div class="stat-foot">Across all semesters</div></div><div class="card stat hover"><div class="stat-label">Study logged</div><div class="stat-value">${(study/60).toFixed(1)}h</div><div class="stat-foot">All recorded sessions</div></div><div class="card stat hover"><div class="stat-label">Resources</div><div class="stat-value">${state.resources.length}</div><div class="stat-foot">URLs saved locally</div></div></div>`}
function classRow(c){const co=courseById(c.courseId),now=new Date(),same=Number(c.day)===now.getDay();return `<div class="item clickable" onclick="openTimetableModal('${c.id}')"><div class="item-left"><div class="item-icon" style="background:${esc(co?.color||state.settings.accent)}22">${esc(co?.icon||'◈')}</div><div class="item-main"><div class="item-title">${esc(co?.name||'Class')}</div><div class="item-sub">${fmtTime(c.start)}–${fmtTime(c.end)} · ${esc(c.room||'Room not set')} · ${esc(c.type||'Lecture')}</div></div></div><div class="item-right">${same&&nextClass()?.id===c.id?'<span class="pill success">NEXT</span>':''}</div></div>`}
function classesToday(){const d=new Date().getDay(),day=today();return state.timetable.filter(c=>Number(c.day)===d&&(!c.startDate||day>=c.startDate)&&(!c.endDate||day<=c.endDate)).sort((a,b)=>a.start.localeCompare(b.start));}
function nextClass(){const now=new Date();const nowDay=now.getDay(),nowMin=now.getHours()*60+now.getMinutes();const candidates=[];for(const c of state.timetable){const [h,m]=String(c.start||'00:00').split(':').map(Number);const startMin=h*60+m;let delta=(Number(c.day)-nowDay+7)%7;if(delta===0&&startMin<nowMin)delta=7;if(c.startDate&&today(now)<c.startDate)continue;if(c.endDate&&today(now)>c.endDate)continue;candidates.push({c,delta,total:delta*1440+startMin});}candidates.sort((a,b)=>a.total-b.total||a.c.start.localeCompare(b.c.start));return candidates[0]?.c||null;}
function renderAcademic(){const p=state.profile,sem=currentSemester(),gp=state.gradingProfiles.find(g=>g.id===state.activeGradingProfile);return pageHead('Foundation','Academic Profile','Identity, university and configurable academic rules used across MaoozOS.',btn('Edit Profile','openAcademicModal()','btn primary'))+`<div class="grid g3"><div class="card hover"><div class="eyebrow">Student</div><div class="metric" style="margin-top:9px">${esc(p.name||'Not set')}</div><div class="muted tiny">${esc(p.rollNo||'Roll number not set')}</div></div><div class="card hover"><div class="eyebrow">University</div><div class="metric" style="margin-top:9px;font-size:20px">${esc(p.university||'Not set')}</div><div class="muted tiny">${esc(p.campus||'Campus not set')} · ${esc(p.degree||'Degree not set')}</div></div><div class="card hover"><div class="eyebrow">Current semester</div><div class="metric" style="margin-top:9px">${esc(sem?.name||'Not set')}</div><div class="muted tiny">${esc(gp?.name||'No grading profile')}</div></div></div><div class="section-head"><div class="section-title">Academic rules</div>${btn('＋ Grading Profile','openGradingProfileModal()','btn small')}</div><div class="grid g2"><div class="card"><div class="section-title">Active grading profile</div><div class="item" style="margin-top:10px"><div class="item-main"><div class="item-title">${esc(gp?.name||'None')}</div><div class="item-sub">Method: ${esc(gp?.method||'—')} · Rounding: ${gp?.rounding??'—'} decimals</div></div></div><div class="form-help" style="margin-top:10px">Relative grading is never guessed. Configure an exact official method or enter the official course grade manually.</div></div><div class="card"><div class="section-title">Grade scale</div><div class="chip-row" style="margin-top:10px">${(gp?.scale||[]).map(r=>`<span class="chip">${esc(r[0])} = ${Number(r[1]).toFixed(2)}</span>`).join('')}</div></div></div><div class="section-head"><div class="section-title">University links</div>${btn('＋ Add URL','openResourceModal()','btn small')}</div><div class="card"><div class="list">${state.resources.filter(r=>!r.courseIds?.length).slice(0,8).map(resourceRow).join('')||`<div class="empty"><h4>No global university links</h4><p>Add your portal, LMS, timetable and other important URLs.</p></div>`}</div></div>`}
function renderSemesters(){const rows=state.semesters.map(s=>{const g=semesterGPA(s.id),cs=coursesForSem(s.id);return `<div class="item"><div class="item-left"><div class="item-icon">▤</div><div class="item-main"><div class="item-title">${esc(s.name)} ${s.finalized?'🔒':''}</div><div class="item-sub">${esc(s.academicYear||'Academic year not set')} · ${cs.length} courses · ${cs.reduce((n,c)=>n+Number(c.credits||0),0)} credits</div></div></div><div class="item-right"><span class="pill">GPA ${g==null?'—':g.toFixed(2)}</span>${btn('Open',`openSemesterDetails('${s.id}')`,'btn small')}${btn('Edit',`openSemesterModal('${s.id}')`,'btn small')}</div></div>`}).join('');return pageHead('Academic','Semesters','Your complete semester history, summaries, snapshots and protected final records.',btn('＋ Semester','openSemesterModal()','btn primary'))+`<div class="card"><div class="list">${rows||`<div class="empty"><h4>No semesters yet</h4><p>Create Semester 1 or import a historical semester summary.</p></div>`}</div></div>`}
function renderCourses(){const grouped=state.semesters.map(s=>{const cs=coursesForSem(s.id);return `<div class="section-head"><div><div class="section-title">${esc(s.name)}</div><div class="section-note">${cs.length} courses</div></div>${btn('＋ Add Course',`openCourseModal('','${s.id}')`,'btn small')}</div><div class="grid g3">${cs.map(c=>`<div class="card hover clickable" onclick="openCourseModal('${c.id}')"><div class="split"><div class="item-icon" style="background:${esc(c.color||state.settings.accent)}22">${esc(c.icon||'◈')}</div><span class="pill">${Number(c.credits)} cr</span></div><div class="item-title" style="font-size:14px;margin-top:12px">${esc(c.name)}</div><div class="item-sub">${esc(c.code||'No code')} · ${esc(c.section||'No section')} · ${esc(c.instructor||'Instructor not set')}</div><div class="split" style="margin-top:13px"><span class="pill">Grade ${esc(c.grade||'—')}</span><span class="pill">Att ${attendanceStats(c.id).percent==null?'—':attendanceStats(c.id).percent.toFixed(1)+'%'}</span></div></div>`).join('')||`<div class="empty"><h4>No courses</h4><p>Add your courses to this semester.</p></div>`}</div>`}).join('');return pageHead('Academic','Courses','Every course is a hub connected to grades, attendance, tasks, notes, resources and timetable.',btn('＋ Course','openCourseModal()','btn primary'))+grouped}
function renderTimetable(){const headers=[...Array(7)].map((_,i)=>{const di=(state.settings.weekStart+i)%7;return `<div class="week-cell week-head ${di===new Date().getDay()?'today-col':''}">${DAY_SHORT[di]}</div>`}).join('');const times=[];for(let h=7;h<=22;h++)times.push(`${String(h).padStart(2,'0')}:00`);let cells=`<div class="week-cell week-head">Time</div>${headers}`;for(const t of times){cells+=`<div class="week-cell time-col">${fmtTime(t)}</div>`;for(let i=0;i<7;i++){const di=(state.settings.weekStart+i)%7;const items=state.timetable.filter(c=>Number(c.day)===di&&c.start.slice(0,2)===t.slice(0,2));cells+=`<div class="week-cell ${di===new Date().getDay()?'today-col':''}">${items.map(c=>`<div class="class-chip" onclick="openTimetableModal('${c.id}')"><strong>${esc(courseById(c.courseId)?.name||'Class')}</strong><small>${fmtTime(c.start)}–${fmtTime(c.end)} · ${esc(c.room||'')}</small></div>`).join('')}</div>`}}const all=state.timetable.slice().sort((a,b)=>Number(a.day)-Number(b.day)||a.start.localeCompare(b.start));return pageHead('Schedule','Timetable','Ultra-final class schedule: one class record drives the weekly view, Dashboard priority and reminders.',btn('＋ Add Class','openTimetableModal()','btn primary'))+`<div class="grid g3"><div class="card hover"><div class="eyebrow">Today</div><div class="metric" style="margin-top:8px">${classesToday().length}</div><div class="muted tiny">Classes scheduled</div></div><div class="card hover"><div class="eyebrow">Next</div><div class="metric" style="font-size:20px;margin-top:8px">${nextClass()?esc(courseById(nextClass().courseId)?.name||'Class'):'—'}</div><div class="muted tiny">${nextClass()?fmtTime(nextClass().start)+' · '+DAY_SHORT[Number(nextClass().day)]:'No upcoming class'}</div></div><div class="card hover"><div class="eyebrow">Timetable URL</div><div class="item-sub" style="margin-top:10px">${state.resources.find(r=>/timetable|schedule/i.test(r.name))?resourceRow(state.resources.find(r=>/timetable|schedule/i.test(r.name))):'Add your university timetable URL from Resources.'}</div></div></div><div class="section-head"><div class="section-title">Weekly schedule</div><div class="section-note">Click a class to edit it</div></div><div class="week"><div class="week-grid">${cells}</div></div><div class="section-head"><div class="section-title">All class records</div><div class="section-note">Nothing is hidden by the grid</div></div><div class="card"><div class="list">${all.map(c=>`<div class="item" onclick="openTimetableModal('${c.id}')"><div class="item-left"><div class="item-icon">🗓</div><div class="item-main"><div class="item-title">${esc(courseById(c.courseId)?.name||'Class')}</div><div class="item-sub">${DAY_SHORT[Number(c.day)]} · ${fmtTime(c.start)}–${fmtTime(c.end)} · ${esc(c.room||'Room not set')} · ${esc(c.type||'Lecture')}</div></div></div><div class="item-right"><span class="pill">${Number(c.reminder||0)>0?c.reminder+' min reminder':'No reminder'}</span>${btn('Edit',`openTimetableModal('${c.id}')`,'btn small')}</div></div>`).join('')||`<div class="empty"><h4>No classes</h4><p>Add your first class to build the schedule.</p></div>`}</div></div>`}
function renderGrades(){const rows=state.courses.map(c=>{const gp=courseGradePoints(c);const score=weightedCourseScore(c.id);return `<tr><td>${esc(c.name)}</td><td>${Number(c.credits)}</td><td><input class="inline-input" id="grade_${c.id}" value="${esc(c.grade||'')}" placeholder="A-"></td><td><input class="inline-input" id="gp_${c.id}" type="number" step="0.01" value="${c.gradePoint??''}" placeholder="auto"></td><td>${gp==null?'—':gp.toFixed(2)}</td><td>${score?score.score.toFixed(2)+'%':'—'}</td><td>${btn('Save',`saveGrade('${c.id}')`,'btn small')}${btn('Audit',`openCalculationAudit('${c.id}')`,'btn small')}</td></tr>`}).join('');const s= currentSemester(),sg=s?semesterGPA(s.id):null,all=cgpa();return pageHead('Academic','Grades & GPA','One authoritative calculation engine. Blank values are never treated as zero.',btn('＋ Assessment','openAssessmentModal()','btn primary'))+`<div class="stat-grid"><div class="card stat"><div class="stat-label">Current GPA</div><div class="stat-value">${sg==null?'—':sg.toFixed(2)}</div><div class="stat-foot">${s?esc(s.name):'No active semester'}</div></div><div class="card stat"><div class="stat-label">CGPA</div><div class="stat-value">${all==null?'—':all.toFixed(2)}</div><div class="stat-foot">All valid GPA-counted courses</div></div><div class="card stat"><div class="stat-label">Courses</div><div class="stat-value">${state.courses.length}</div><div class="stat-foot">Grade records</div></div><div class="card stat"><div class="stat-label">Assessments</div><div class="stat-value">${state.assessments.length}</div><div class="stat-foot">Raw marks saved</div></div></div><div class="section-head"><div class="section-title">Course grades</div><div class="section-note">Edit grade + grade points explicitly</div></div><div class="table-wrap"><table><thead><tr><th>Course</th><th>Cr</th><th>Official grade</th><th>Grade point</th><th>Used GP</th><th>Weighted score</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="7">No courses yet.</td></tr>`}</tbody></table></div><div class="section-head"><div class="section-title">Assessment records</div>${btn('＋ Add Assessment','openAssessmentModal()','btn small')}</div><div class="card"><div class="list">${state.assessments.slice(0,30).map(a=>`<div class="item"><div class="item-left"><div class="item-icon">⌁</div><div class="item-main"><div class="item-title">${esc(a.name)}</div><div class="item-sub">${esc(courseById(a.courseId)?.name||'Course')} · ${esc(a.type)} · ${a.obtained===''?'Pending':Number(a.obtained)+'/'+Number(a.max)} · ${Number(a.weight||0)}%</div></div></div><div class="item-right">${btn('Edit',`openAssessmentModal('${a.id}')`,'btn small')}</div></div>`).join('')||`<div class="empty"><h4>No assessments</h4><p>Add quizzes, assignments, labs, midterms and finals.</p></div>`}</div></div>`}

function renderCalendar(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=(first.getDay()-state.settings.weekStart+7)%7,days=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<start;i++)cells.push(`<div class="cal-day other"></div>`);for(let day=1;day<=days;day++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,todayFlag=date===today();const items=[];state.tasks.filter(t=>t.dueDate===date).slice(0,3).forEach(t=>items.push(`<div class="cal-evt task">✓ ${esc(t.title)}</div>`));state.assessments.filter(a=>a.date===date).slice(0,3).forEach(a=>items.push(`<div class="cal-evt exam">⌁ ${esc(a.name)}</div>`));state.events.filter(e=>e.date===date).slice(0,3).forEach(e=>items.push(`<div class="cal-evt personal">□ ${esc(e.title)}</div>`));cells.push(`<div class="cal-day ${todayFlag?'today':''}"><div class="cal-num">${day}</div>${items.join('')}</div>`)}return pageHead('Planner','Calendar','One calendar view over tasks, assessments and personal events.',btn('＋ Event','openEventModal()','btn primary'))+`<div class="card"><div class="split"><div><div class="section-title">${d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><div class="muted tiny">The calendar displays source records; it does not duplicate them.</div></div></div><div class="calendar" style="margin-top:14px">${DAY_SHORT.map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function renderStudy(){const mins=state.studySessions.reduce((n,s)=>n+Number(s.minutes||0),0);return pageHead('Productivity','Study Tracker','Record actual study time, compare it with plans and keep a searchable history.',btn('＋ Study Session','openStudyModal()','btn primary'))+`<div class="stat-grid"><div class="card stat"><div class="stat-label">Total study</div><div class="stat-value">${(mins/60).toFixed(1)}h</div></div><div class="card stat"><div class="stat-label">Sessions</div><div class="stat-value">${state.studySessions.length}</div></div><div class="card stat"><div class="stat-label">Today</div><div class="stat-value">${(state.studySessions.filter(s=>s.date===today()).reduce((n,s)=>n+Number(s.minutes||0),0)/60).toFixed(1)}h</div></div><div class="card stat"><div class="stat-label">This week</div><div class="stat-value">${(state.studySessions.filter(s=>{const d=new Date(s.date+'T00:00:00');const now=new Date();const monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));return d>=new Date(monday.toDateString());}).reduce((n,s)=>n+Number(s.minutes||0),0)/60).toFixed(1)}h</div></div></div><div class="section-head"><div class="section-title">Recent sessions</div></div><div class="card"><div class="list">${state.studySessions.slice(0,40).map(s=>`<div class="item"><div class="item-left"><div class="item-icon">◉</div><div class="item-main"><div class="item-title">${esc(courseById(s.courseId)?.name||'General')} ${s.topic?'· '+esc(s.topic):''}</div><div class="item-sub">${fmtDate(s.date)} · ${Number(s.minutes)} min ${s.note?'· '+esc(s.note):''}</div></div></div></div>`).join('')||`<div class="empty"><h4>No study sessions</h4><p>Start logging your actual study time.</p></div>`}</div></div>`}

style="margin-top:13px">Analytics are observational. They do not invent grades, predict outcomes without explicit inputs, or replace official university results.</div>`;

function taskCompletion(){const a=state.tasks.filter(t=>t.status!=='cancelled');return a.length?state.tasks.filter(t=>t.status==='completed').length/a.length*100:0}
function avgAttendance(){const xs=state.courses.map(c=>attendanceStats(c.id).percent).filter(x=>x!=null);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null}
function drawGPA(){const c=document.getElementById('gpaCanvas');if(!c)return;const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const vals=state.semesters.map(s=>semesterGPA(s.id));const good=vals.filter(v=>v!==null);if(!good.length){ctx.fillStyle='#7585a0';ctx.font='12px system-ui';ctx.fillText('Add official grades to see the trend.',20,70);return;}const max=Math.max(4,...good),min=0;ctx.strokeStyle='rgba(255,255,255,.08)';for(let i=0;i<5;i++){const y=15+i*(h-30)/4;ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(w-20,y);ctx.stroke();}ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();ctx.lineWidth=4;ctx.beginPath();vals.forEach((v,i)=>{if(v===null)return;const x=30+(w-60)*(i/Math.max(vals.length-1,1));const y=h-18-(v/max)*(h-36);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();}
function renderSettings(){const effects=state.settings.effects;return pageHead('System','Settings','Control themes, effects, personalization, notifications, URL recognition and data protection.',btn('Run Tour','startTour(true)','btn primary'))+`<div class="grid g2"><div class="card"><div class="section-title">Visual themes</div><div class="form-help" style="margin:6px 0 11px">Premium themes change the entire visual language without touching your data.</div><div class="theme-grid">${THEMES.map(t=>`<button class="theme-card ${state.settings.theme===t[0]?'selected':''}" onclick="setTheme('${t[0]}')"><span class="theme-dot sw-${t[0]}"></span><strong>${t[1]}</strong><small>${t[2]}</small></button>`).join('')}</div></div><div class="card"><div class="section-title">Effects</div><div class="list" style="margin-top:8px">${['ambient','glass','motion','grid','cursor','ripple','particles'].map(k=>`<div class="item"><div class="item-main"><div class="item-title">${k[0].toUpperCase()+k.slice(1)}</div><div class="item-sub">${effectDesc(k)}</div></div><label class="switch"><input type="checkbox" ${effects[k]!==false?'checked':''} onchange="setEffect('${k}',this.checked)"><span></span></label></div>`).join('')}</div></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><div class="section-title">Time & personalization</div><div class="list" style="margin-top:8px"><div class="item"><div class="item-main"><div class="item-title">Display name</div><div class="item-sub">${esc(state.profile.name||'Student')}</div></div>${btn('Edit',`openAcademicModal()`,'btn small')}</div><div class="item"><div class="item-main"><div class="item-title">12 / 24-hour clock</div></div><label class="switch"><input type="checkbox" ${state.settings.clock24?'checked':''} onchange="state.settings.clock24=this.checked;persist();refresh()"><span></span></label></div><div class="item"><div class="item-main"><div class="item-title">Show greeting</div></div><label class="switch"><input type="checkbox" ${state.settings.showGreeting?'checked':''} onchange="state.settings.showGreeting=this.checked;persist();refresh()"><span></span></label></div><div class="item"><div class="item-main"><div class="item-title">Accent color</div></div><input type="color" value="${esc(state.settings.accent)}" onchange="setAccent(this.value)" style="height:33px;width:44px;padding:3px;border:1px solid var(--border);border-radius:9px;background:transparent"></div></div></div><div class="card"><div class="section-title">Notifications</div><div class="list" style="margin-top:8px"><div class="item"><div class="item-main"><div class="item-title">Browser notifications</div><div class="item-sub">In-app reminders always remain available.</div></div>${btn('Request',`requestNotifications()`,'btn small')}</div>${androidAvailable()?`<div class="item"><div class="item-main"><div class="item-title">Android notifications</div><div class="item-sub">Use Android's native notification permission and settings.</div></div><div class="row-actions">${btn('Enable','MaoozAndroid.requestNotifications()','btn small primary')}${btn('System settings','MaoozAndroid.openNotificationSettings()','btn small')}${btn('Test','MaoozAndroid.testNotification()','btn small')}</div></div><div class="item"><div class="item-main"><div class="item-title">Precise class reminders</div><div class="item-sub">Android exact-alarm access may be enabled for better timing.</div></div>${btn('Configure','MaoozAndroid.openExactAlarmSettings()','btn small')}</div>`:''}<div class="item"><div class="item-main"><div class="item-title">Notification engine</div><div class="item-sub">${state.settings.notifications?'Enabled':'Disabled'}</div></div><label class="switch"><input type="checkbox" ${state.settings.notifications?'checked':''} onchange="state.settings.notifications=this.checked;persist();refresh()"><span></span></label></div><div class="item"><div class="item-main"><div class="item-title">Quiet hours</div><div class="item-sub">${state.settings.quietStart}–${state.settings.quietEnd}</div></div><label class="switch"><input type="checkbox" ${state.settings.quietHours?'checked':''} onchange="state.settings.quietHours=this.checked;persist();refresh()"><span></span></label></div></div></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><div class="section-title">Data & backup</div><div class="row-actions" style="margin-top:10px">${btn('Export Full Backup','backupExport()','btn primary')}${btn('Import Backup','backupImport()','btn')}${btn('Test Notification','pushNotification(\'Test notification\',\'MaoozOS reminder engine is working locally.\')','btn')}</div><div class="alert info" style="margin-top:12px">All records and settings are stored locally. Export backups before major changes or browser resets.</div></div><div class="card"><div class="section-title">URL recognition</div><div class="muted tiny" style="margin-top:6px">${URL_RULES.length} built-in service patterns. Your overrides always win.</div><div class="row-actions" style="margin-top:10px">${btn('＋ Custom Rule','openCustomRuleModal()','btn small')}${btn('Clear Custom Rules','clearCustomRules()','btn small danger')}</div></div></div>`}
function effectDesc(k){return ({ambient:'Animated background glow',glass:'Frosted panel depth',motion:'Hover and page transitions',grid:'Ambient background grid',cursor:'Cursor-following accent glow',ripple:'Click ripple interaction',particles:'Floating background particles'})[k]||''}
function setTheme(t){if(!THEMES.some(x=>x[0]===t))return userError('Theme unavailable','The selected theme is not installed.','Choose one shown in Settings.');state.settings.theme=t;persist();applyTheme();renderCurrent();toast('Theme applied',t+' is now active.');}
